<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#080a0c"><title>LOW / ALT · מצגת מעבדת המשחקים</title>
  <style>
    :root{--bg:#080a0c;--panel:#111616;--ink:#f0f0e9;--muted:#b4b9b1;--line:rgba(240,240,233,.2);--acid:#d8fa55;--cyan:#8df6ee;--rust:#ff956d;font-family:Arial,"Helvetica Neue",sans-serif;color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--ink)}body{overflow:hidden}.deck{position:fixed;inset:0;display:grid;place-items:center;background:#050707}.slide{position:absolute;width:min(100vw,calc(100vh * 16 / 9));height:min(100vh,calc(100vw * 9 / 16));aspect-ratio:16/9;overflow:hidden;background:var(--bg);opacity:0;visibility:hidden;transform:translateY(8px);transition:opacity .28s ease,transform .35s ease;padding:6.2% 7.1% 7.4%;display:flex;flex-direction:column;justify-content:center}.slide.active{opacity:1;visibility:visible;transform:none}.slide:before{content:"";position:absolute;inset:0;z-index:0;background:radial-gradient(ellipse at 12% 82%,rgba(141,246,238,.09),transparent 35%),radial-gradient(ellipse at 88% 11%,rgba(216,250,85,.07),transparent 30%),linear-gradient(133deg,rgba(255,255,255,.025),transparent 48%);pointer-events:none}.slide>*{position:relative;z-index:1}.slide-number{position:absolute;bottom:4.6%;left:7.1%;font:11px Menlo,monospace;color:#888f87;direction:ltr}.brand{position:absolute;top:5%;left:7.1%;font:600 10px Menlo,monospace;letter-spacing:.15em;color:#dbddd4;direction:ltr}.brand i{display:inline-grid;place-items:center;width:26px;height:26px;margin-right:8px;border:1px solid var(--acid);font-style:normal;color:var(--acid)}.eyebrow{font:500 11px Menlo,monospace;color:var(--acid);letter-spacing:.1em;margin:0 0 16px;text-transform:uppercase}.title{font-weight:800;font-size:clamp(36px,5.1vw,72px);letter-spacing:-.045em;line-height:1.04;margin:0 0 20px;max-width:860px}.title em{color:var(--acid);font-style:normal}.subtitle{font-size:clamp(18px,2.1vw,29px);line-height:1.35;color:#dbddd5;margin:0 0 14px}.body{max-width:670px;font-size:clamp(16px,1.55vw,21px);line-height:1.63;color:var(--muted);margin:0}.note{font:12px Menlo,monospace;color:#959c93;line-height:1.65;margin-top:22px}.cover{justify-content:flex-end;padding-bottom:10%}.cover .title{font:800 clamp(70px,14vw,192px) Menlo,monospace;letter-spacing:-.11em;line-height:.84;direction:ltr;text-align:left;margin:0 0 22px;color:var(--ink)}.cover .title em{color:var(--acid)}.cover .subtitle{max-width:800px}.cover .body{max-width:590px}.cover:before{background:linear-gradient(90deg,rgba(8,10,12,.97),rgba(8,10,12,.54) 58%,rgba(8,10,12,.2)),url('assets/cover-art.png') 50% 47%/cover,radial-gradient(circle at 70% 30%,#304143,#080a0c 55%)}.split,.game,.game-slide{display:grid;grid-template-columns:1fr .95fr;gap:5.5%;align-items:center}.split .copy,.game-slide .copy{max-width:100%;}.image-frame{height:72%;width:100%;min-height:250px;overflow:hidden;border:1px solid var(--line);position:relative;background:#151a1a}.image-frame img{width:100%;height:100%;object-fit:cover;display:block}.image-frame:after{content:"";position:absolute;inset:55% 0 0;background:linear-gradient(transparent,rgba(8,10,12,.55))}.game-slide .image-frame{height:74%}.image-label{position:absolute;left:15px;bottom:13px;z-index:2;font:10px Menlo,monospace;color:#f1f2ea;direction:ltr}.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}.tag{border:1px solid var(--line);padding:7px 10px;color:#c6cbc2;font:10px Menlo,monospace;direction:ltr}.controls{color:var(--acid);font:12px Menlo,monospace;margin-top:19px;direction:ltr;text-align:right}.timeline{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:40px}.timeline-card,.pack-card,.check-row,.metric{border:1px solid var(--line);background:rgba(255,255,255,.025)}.timeline-card{min-height:150px;padding:18px 16px}.num{font:12px Menlo,monospace;color:var(--acid);display:block;margin-bottom:24px}.timeline-card h3,.pack-card h3{font-size:20px;margin:0 0 8px}.timeline-card p,.pack-card p{font-size:14px;line-height:1.55;color:var(--muted);margin:0}.metric-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin:30px 0 18px}.metric{padding:19px 17px;min-height:115px}.metric b{font:700 clamp(33px,4vw,55px) Menlo,monospace;color:var(--acid);display:block;direction:ltr;text-align:right}.metric span{font-size:13px;color:var(--muted)}.pack-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:27px}.pack-card{padding:18px;min-height:135px}.pack-card h3{font:600 14px Menlo,monospace;color:var(--acid);direction:ltr;text-align:left}.checklist{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:26px}.check-row{padding:14px 14px 14px 12px;display:flex;align-items:center;gap:11px;font-size:15px;color:#daddd5;line-height:1.4}.check-row i{width:18px;height:18px;flex:none;border:1px solid var(--acid);display:grid;place-items:center;color:var(--acid);font:12px Menlo,monospace;font-style:normal}.links{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}.links a{color:var(--bg);background:var(--acid);padding:12px 17px;text-decoration:none;font-size:13px;font-weight:700}.links a:last-child{background:transparent;border:1px solid var(--line);color:var(--ink)}.source-link{color:var(--cyan);font:12px Menlo,monospace;direction:ltr;display:inline-block;margin-top:18px}.controls-bar{position:fixed;z-index:10;left:50%;bottom:20px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:7px 9px;background:rgba(8,10,12,.88);border:1px solid var(--line);backdrop-filter:blur(12px)}.controls-bar button{width:34px;height:32px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;font-size:17px}.controls-bar button:hover{border-color:var(--acid);color:var(--acid)}.counter{min-width:56px;text-align:center;color:#a5aaa2;font:10px Menlo,monospace;direction:ltr}.progress{position:fixed;z-index:11;inset:0 auto auto 0;height:3px;width:0;background:var(--acid);transition:width .25s}.help{position:fixed;z-index:5;right:22px;bottom:27px;color:#777e76;font:9px Menlo,monospace;direction:ltr}.help kbd{color:#b7bbb3;font:9px Menlo,monospace}@media(max-width:700px){.slide{padding:10% 7% 14%}.title{font-size:clamp(34px,8vw,52px)}.split,.game,.game-slide{grid-template-columns:1fr;grid-template-rows:auto 36%;gap:18px}.image-frame,.game-slide .image-frame{height:100%;min-height:140px}.split .body,.game-slide .body{font-size:14px}.timeline{grid-template-columns:repeat(2,1fr);gap:8px;margin-top:18px}.timeline-card{min-height:105px;padding:12px}.timeline-card .num{margin-bottom:8px}.timeline-card h3{font-size:16px}.timeline-card p,.pack-card p{font-size:11px}.metric-grid{grid-template-columns:repeat(2,1fr);gap:8px;margin:16px 0}.metric{min-height:70px;padding:9px}.metric b{font-size:30px}.metric span{font-size:10px}.pack-grid{gap:7px;margin-top:16px}.pack-card{padding:10px;min-height:100px}.pack-card h3{font-size:10px}.checklist{gap:7px;margin-top:15px}.check-row{font-size:11px;padding:9px;gap:7px}.check-row i{width:14px;height:14px}.note{font-size:10px;margin-top:12px}.controls-bar{bottom:10px}.help{display:none}.cover .title{font-size:clamp(56px,16vw,105px)}.slide-number{bottom:3.7%}}
    @media print{@page{size:13.333in 7.5in;margin:0}html,body{width:13.333in;height:auto;background:var(--bg);overflow:visible;display:block}.deck{position:static;width:13.333in;height:auto;background:var(--bg);overflow:visible;display:block}.slide{display:flex!important;position:relative;visibility:visible;opacity:1;transform:none;width:13.333in;height:7.5in;page-break-after:always;break-after:page;box-shadow:none}.slide:last-child{page-break-after:auto;break-after:auto}.controls-bar,.progress,.help{display:none!important}}
  </style>
</head>
<body>
  <div class="deck" id="deck"></div><div class="progress" id="progress"></div>
  <div class="controls-bar"><button id="prev" aria-label="שקופית קודמת">←</button><span class="counter" id="counter">01 / 13</span><button id="next" aria-label="שקופית הבאה">→</button><button id="print" aria-label="הדפסה או PDF">⌑</button></div>
  <div class="help">ARROWS <kbd>←</kbd> <kbd>→</kbd> · HOME · END · P PDF</div>
  <script type="module">
    import data from './deck.json' with { type: 'json' };
    const deck=document.querySelector('#deck');
    const escapeHtml=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function img(path,label){return `<div class="image-frame"><img src="${escapeHtml(path)}" alt="צילום מסך אמיתי מתוך המשחק"><span class="image-label">${escapeHtml(label||'LOW / ALT · LIVE FRAME')}</span></div>`}
    function tags(items){return items?.length?`<div class="tags">${items.map(x=>`<span class="tag">${escapeHtml(x)}</span>`).join('')}</div>`:''}
    function render(s,i){let content='';
      if(s.type==='cover')content=`<p class="eyebrow">${escapeHtml(s.eyebrow)}</p><h1 class="title">LOW / <em>ALT</em></h1><p class="subtitle">${escapeHtml(s.subtitle)}</p><p class="body">${escapeHtml(s.body)}</p>`;
      else if(s.type==='split')content=`<div class="copy"><p class="eyebrow">${escapeHtml(s.eyebrow)}</p><h2 class="title">${escapeHtml(s.title)}</h2><p class="body">${escapeHtml(s.body)}</p>${tags(s.tags)}<p class="note">${escapeHtml(s.note||'')}</p></div>${img(s.image,s.eyebrow)}`;
      else if(s.type==='game')content=`${img(s.image,s.eyebrow)}<div class="copy"><p class="eyebrow">${escapeHtml(s.eyebrow)}</p><h2 class="title">${escapeHtml(s.title)}</h2><p class="subtitle">${escapeHtml(s.subtitle)}</p><p class="body">${escapeHtml(s.body)}</p><p class="controls">${escapeHtml(s.controls)}</p></div>`;
      else if(s.type==='timeline')content=`<p class="eyebrow">${escapeHtml(s.eyebrow)}</p><h2 class="title">${escapeHtml(s.title)}</h2><p class="body">${escapeHtml(s.body)}</p><div class="timeline">${s.items.map(x=>`<article class="timeline-card"><span class="num">${escapeHtml(x[0])}</span><h3>${escapeHtml(x[1])}</h3><p>${escapeHtml(x[2])}</p></article>`).join('')}</div>`;
      else if(s.type==='metrics')content=`<p class="eyebrow">${escapeHtml(s.eyebrow)}</p><h2 class="title">${escapeHtml(s.title)}</h2><div class="metric-grid">${s.items.map(x=>`<div class="metric"><b>${escapeHtml(x[0])}</b><span>${escapeHtml(x[1])}</span></div>`).join('')}</div><p class="body">${escapeHtml(s.body)}</p>`;
      else if(s.type==='pack')content=`<p class="eyebrow">${escapeHtml(s.eyebrow)}</p><h2 class="title">${escapeHtml(s.title)}</h2><div class="pack-grid">${s.items.map(x=>`<article class="pack-card"><h3>${escapeHtml(x[0])}</h3><p>${escapeHtml(x[1])}</p></article>`).join('')}</div><p class="note">${escapeHtml(s.note)}</p>`;
      else if(s.type==='checklist')content=`<p class="eyebrow">${escapeHtml(s.eyebrow)}</p><h2 class="title">${escapeHtml(s.title)}</h2><div class="checklist">${s.items.map(x=>`<div class="check-row"><i>✓</i><span>${escapeHtml(x)}</span></div>`).join('')}</div>`;
      else if(s.type==='release')content=`<p class="eyebrow">${escapeHtml(s.eyebrow)}</p><h2 class="title">${escapeHtml(s.title)}</h2><p class="body">${escapeHtml(s.body)}</p><div class="links">${s.links.map(x=>`<a href="${escapeHtml(x[1])}">${escapeHtml(x[0])} ↗</a>`).join('')}</div>`;
      else content=`<p class="eyebrow">${escapeHtml(s.eyebrow)}</p><h2 class="title">${escapeHtml(s.title)}</h2><p class="body">${escapeHtml(s.body)}</p><p class="note">${escapeHtml(s.note)}</p><a class="source-link" href="${escapeHtml(s.link)}">${escapeHtml(s.link)}</a>`;
      return `<section class="slide ${s.type} ${i===0?'active':''}" aria-label="שקופית ${i+1}"><span class="brand"><i>03</i> LOW / ALT</span>${content}<span class="slide-number">${String(i+1).padStart(2,'0')} / ${String(data.slides.length).padStart(2,'0')}</span></section>`;
    }
    deck.innerHTML=data.slides.map(render).join('');
    const slides=[...document.querySelectorAll('.slide')];let current=0;
    function show(n){current=Math.max(0,Math.min(slides.length-1,n));slides.forEach((s,i)=>s.classList.toggle('active',i===current));document.querySelector('#counter').textContent=`${String(current+1).padStart(2,'0')} / ${String(slides.length).padStart(2,'0')}`;document.querySelector('#progress').style.width=((current+1)/slides.length*100)+'%';history.replaceState(null,'','#'+(current+1));}
    document.querySelector('#prev').onclick=()=>show(current-1);document.querySelector('#next').onclick=()=>show(current+1);document.querySelector('#print').onclick=()=>window.print();
    window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='PageDown')show(current+1);if(e.key==='ArrowRight'||e.key==='PageUp')show(current-1);if(e.key==='Home')show(0);if(e.key==='End')show(slides.length-1);if(e.key.toLowerCase()==='p')window.print();});
    if(location.hash)show(Number(location.hash.slice(1))-1);window.__deck={ready:true,total:slides.length,go:show};
  </script>
</body>
</html>
